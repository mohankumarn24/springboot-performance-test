spring.application.name=springboot-performance-test

# -----------------------------
# SERVER CORE
# -----------------------------

# Server port. Default=8080
server.port=8080

# Connection timeout waiting for request data. Default=20s
server.connection-timeout=20s


# -----------------------------
# TOMCAT THREAD POOL
# -----------------------------

# Max worker threads processing requests. Default=200
server.tomcat.threads.max=500

# Minimum idle worker threads kept ready. Default=10
server.tomcat.threads.min-spare=100


# -----------------------------
# CONNECTION MANAGEMENT
# -----------------------------

# Maximum simultaneous TCP connections. Default=8192
server.tomcat.max-connections=30000

# Request queue length when all threads are busy. Default=100
server.tomcat.accept-count=2000

# Keep-alive timeout. Default=20s
server.tomcat.keep-alive-timeout=15s

# Maximum requests per keep-alive connection. Default=100
server.tomcat.max-keep-alive-requests=1000


# -----------------------------
# REQUEST SIZE LIMITS
# -----------------------------

# Maximum size of HTTP form POST data. Default=2MB
server.tomcat.max-http-form-post-size=10MB

# Maximum request body swallowed when upload aborted. Default=2MB
server.tomcat.max-swallow-size=10MB


# -----------------------------
# COMPRESSION
# -----------------------------

# Enable HTTP compression. Default=false
server.compression.enabled=true

# Minimum response size to compress. Default=2KB
server.compression.min-response-size=2KB

# MIME types eligible for compression
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json


# -----------------------------
# HTTP/2
# -----------------------------

# Enable HTTP/2 support. Default=false
server.http2.enabled=true


# -----------------------------
# GRACEFUL SHUTDOWN
# -----------------------------

# Enable graceful shutdown. Default=immediate
server.shutdown=graceful

# Shutdown timeout. Default=30s
spring.lifecycle.timeout-per-shutdown-phase=30s
